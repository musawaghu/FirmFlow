<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FirmFlow | Final Check</title>
  <meta name="description" content="Employee final check quiz for required onboarding modules." />
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Fira+Sans:wght@400;500;600;700&family=Overpass:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="FirmFlow home">
      <span class="brand-mark" aria-label="FirmFlow logo"></span>
      <div>
        <strong>Firm<span class="flow-word">Flow</span></strong>
        <small>Employee portal</small>
      </div>
    </div>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Dashboard</a>
      <a href="documents.html">Documents</a>
      <a class="active" href="modules.html">Modules</a>
    </nav>

    <button class="button secondary small" type="button">Sign out</button>
  </header>

  <main class="page-shell quiz-page">
    <div class="page-header">
      <div>
        <div class="breadcrumbs" aria-label="Breadcrumbs">
          <span>Portal</span>
          <span>/</span>
          <span>Modules</span>
          <span>/</span>
          <span>Final check</span>
        </div>
        <h1>Benefits enrollment</h1>
      </div>
      <a class="button primary" href="modules.html">Back to modules</a>
    </div>

    <section class="module-shell">
      <div class="folder-tabs" role="tablist" aria-label="Module sub-tabs">
        <button class="folder-tab" type="button">Overview</button>
        <button class="folder-tab" type="button">Passages</button>
        <button class="folder-tab active" type="button">Final check</button>
      </div>

      <div class="folder-panel nested-panel">
        <div class="quiz-layout">
          <div class="quiz-card">
            <div class="question-meta">
              <span class="label">Question 2 of 5</span>
              <span class="inline-tag review">In progress</span>
            </div>

            <h2>When is your benefits enrollment window open?</h2>

            <div class="choices" aria-label="Multiple choice question">
              <label class="choice-option">
                <input type="radio" name="question" />
                <span>Within 30 days of hire</span>
              </label>
              <label class="choice-option">
                <input type="radio" name="question" checked />
                <span>During your first payroll cycle</span>
              </label>
              <label class="choice-option">
                <input type="radio" name="question" />
                <span>After your first 90 days</span>
              </label>
            </div>

            <div class="question-actions">
              <button class="button secondary" type="button">Review module</button>
              <button class="button primary" type="button">Submit answer</button>
            </div>
          </div>

          <aside class="quiz-sidebar panel">
            <div class="panel-head compact">
              <h3>Progress</h3>
            </div>

            <div class="progress-stack">
              <div class="progress-item">
                <span>Answered</span>
                <strong>2 / 5</strong>
              </div>
              <div class="progress-item">
                <span>Pass score</span>
                <strong>80%</strong>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
