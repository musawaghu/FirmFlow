<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FirmFlow | Benefits Enrollment</title>
  <meta name="description" content="Individual onboarding module detail with final check quiz." />
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Fira+Sans:wght@400;500;600;700&family=Overpass:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/module-detail.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="FirmFlow home">
      <span class="brand-mark" aria-label="FirmFlow logo"></span>
      <div>
        <strong>Firm<span class="flow-word">Flow</span></strong>
        <small>Employee portal</small>
      </div>
    </div>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Dashboard</a>
      <a href="documents.html">Documents</a>
      <a class="active" href="modules.html">Modules</a>
    </nav>

    <button class="button secondary small" type="button">Sign out</button>
  </header>

  <main class="page-shell module-detail-page">
    <div class="page-header module-detail-header">
      <div>
        <div class="breadcrumbs" aria-label="Breadcrumbs">
          <span>Portal</span>
          <span>/</span>
          <span>Modules</span>
          <span>/</span>
          <span id="crumb-title">Loading</span>
        </div>
        <h1 id="module-title">Loading</h1>
      </div>
      <span class="module-id" id="module-id">Module</span>
    </div>

    <section class="detail-shell" aria-labelledby="module-overview-title">
      <div class="detail-header">
        <div>
          <p class="eyebrow">Required onboarding</p>
          <h2 id="module-overview-title">Loading</h2>
        </div>
        <span class="inline-tag review" id="module-status">In progress</span>
      </div>

      <div class="detail-grid">
        <article class="detail-card">
          <h3>Overview</h3>
          <p id="module-overview">Loading overview...</p>
        </article>

        <article class="detail-card">
          <h3>Passages</h3>
          <ul id="module-passages"></ul>
        </article>
      </div>
    </section>

    <section class="quiz-shell" id="final-check" aria-labelledby="final-check-title">
      <div class="quiz-header">
        <h2 id="final-check-title">Final check</h2>
        <a href="modules.html">Back to modules</a>
      </div>

      <div class="quiz-row">
        <div class="quiz-panel question-panel">
          <span class="label">Question</span>
          <h3 id="quiz-question">Loading question...</h3>
        </div>

        <div class="quiz-panel passage-panel">
          <span class="label">Passage</span>
          <p id="quiz-passage">Loading passage...</p>
        </div>
      </div>

      <div class="answer-list" id="answer-list" aria-label="Answer choices"></div>
    </section>
  </main>

  <script>
    const MODULE_ORDER = [
      'welcome',
      'culture',
      'policies',
      'technology',
      'operations',
      'people',
      'payroll-benefits',
      'security'
    ];

    const STORAGE_KEY = 'firmflow_module_progress_v1';

    function getProgress() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch (error) {
        return {};
      }
    }

    function setProgress(progress) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    function getStatus(moduleId) {
      return getProgress()[moduleId] || 'not_started';
    }

    function isPreviousComplete(moduleIndex) {
      for (let i = 0; i < moduleIndex; i += 1) {
        if (getStatus(MODULE_ORDER[i]) !== 'completed') {
          return false;
        }
      }
      return true;
    }

    function canOpen(moduleId) {
      const state = getStatus(moduleId);
      if (state === 'completed' || state === 'in_progress') {
        return true;
      }

      const moduleIndex = MODULE_ORDER.indexOf(moduleId);
      return moduleIndex === 0 || isPreviousComplete(moduleIndex);
    }

    const moduleData = {
      welcome: {
        title: 'Welcome to Studio Meridian',
        idLabel: 'Module ID #W-101',
        overview: 'Use the first-day briefing to understand the studio, who to ask for help, and how to get started without guessing.',
        passages: ['Welcome and studio values', 'Who to contact first', 'First-week checklist'],
        question: 'When you do not know who to ask for help on day one, what should you do?',
        passage: 'The handbook says to ask the Office Manager if you are unsure who to contact.',
        answers: [
          'Ask the Office Manager first and they will point you to the right person',
          'Wait until your PM replies to email',
          'Post the question in a general Teams channel',
          'Skip it and figure it out yourself'
        ]
      },
      culture: {
        title: 'Company Culture & Handbook',
        idLabel: 'Module ID #C-102',
        overview: 'This module covers how Studio Meridian communicates, collaborates, and keeps project teams aligned across the firm.',
        passages: ['Design values', 'Communication norms', 'Organization chart'],
        question: 'Where should you look to find the project team and working structure?',
        passage: 'Project pages on SharePoint list the Principal, Project Manager, Design Manager, Project Architect, and BIM Lead.',
        answers: [
          'On the project page in SharePoint',
          'Only in the office hallway bulletin board',
          'In the old intranet home page',
          'In a personal spreadsheet'
        ]
      },
      policies: {
        title: 'Policies',
        idLabel: 'Module ID #P-103',
        overview: 'Review the studio policies around office conduct, privacy, harassment, and confidentiality before your first week is complete.',
        passages: ['Office policies', 'Privacy and devices', 'Harassment prevention'],
        question: 'What is the correct step when a device is lost or a security concern occurs?',
        passage: 'The handbook says to report lost devices and security issues promptly and to ask the appropriate IT contact.',
        answers: [
          'Report the issue immediately and follow the required escalation path',
          'Wait until the end of the week',
          'Ignore it unless it affects your own files',
          'Only tell a coworker in a Teams chat'
        ]
      },
      technology: {
        title: 'Technology Guide & Training',
        idLabel: 'Module ID #T-104',
        overview: 'The technology module covers worksharing, detached copies, BIM standards, and the naming rules used on real project files.',
        passages: ['Revit worksharing', 'Detached test copies', 'Keynotes and file naming'],
        question: 'If you need a copy of the central Revit model for a design option, what should you do?',
        passage: 'The demo quiz answer is to open the central model with Detach from Central and save into the project Sandbox folder.',
        answers: [
          'Open the central model, choose Detach from Central, and save to the Sandbox folder',
          'Copy the central model in File Explorer and rename it',
          'Open a random local file from last week',
          'Send the central model by email to a teammate'
        ]
      },
      operations: {
        title: 'Operations',
        idLabel: 'Module ID #O-105',
        overview: 'Track the rules for timesheets, billing hours, expenses, and the weekly calendar requirements across project work.',
        passages: ['Timesheets', 'Billing your hours', 'Expense reports'],
        question: 'What is the main requirement for submitting timesheets?',
        passage: 'Accurate timesheets are required every week and must be submitted by the stated weekly deadline after admin review of the issue.',
        answers: [
          'Submit the timesheet on time and use the correct project or overhead code',
          'Only submit when your PM asks for it',
          'Use a handwritten sheet instead of the system',
          'Submit it only once a month'
        ]
      },
      people: {
        title: 'Company People',
        idLabel: 'Module ID #P-106',
        overview: 'This module covers the people, offices, and staff contacts you will rely on during your first week on site and in the studio.',
        passages: ['Staff directory', 'Office layout', 'Key contacts'],
        question: 'Where are the project team contacts listed for each assignment?',
        passage: 'The staff directory and project pages point you to the team members assigned to each project.',
        answers: [
          'On the project page in SharePoint',
          'Only in HR orientation slides',
          'On the office printer',
          'In the lunch room poster'
        ]
      },
      'payroll-benefits': {
        title: 'Payroll & Benefits',
        idLabel: 'Module ID #PB-107',
        overview: 'Review payroll setup, direct deposit, benefits enrollment, and PTO rules and limitations during the onboarding period.',
        passages: ['Payroll', 'Benefits enrollment', 'PTO accrual & carry-over'],
        question: 'What is a key payroll and benefits requirement after you start?',
        passage: 'Benefits enrollment must be started within the stated enrollment window and payroll should be set up with direct deposit.',
        answers: [
          'Complete benefits enrollment in the required window and confirm payroll details',
          'Wait until six months have passed',
          'Only review pay stubs once a year',
          'Ask the PM to handle your direct deposit for you'
        ]
      },
      security: {
        title: 'Security Policy Acknowledgment',
        idLabel: 'Module ID #S-108',
        overview: 'This final acknowledgment confirms the employee has reviewed the required security and accountability policies for the studio.',
        passages: ['Security overview', 'Protection responsibilities', 'Documentation'],
        question: 'Which behavior is expected when handling studio security information?',
        passage: 'The handbook emphasizes following policy, reporting issues promptly, and keeping sensitive material protected.',
        answers: [
          'Follow the security guidance and report issues promptly',
          'Share sensitive information with anyone in the office',
          'Keep it in your personal email',
          'Ignore it until a client raises a concern'
        ]
      }
    };

    const moduleId = new URLSearchParams(window.location.search).get('id') || 'welcome';
    const moduleIndex = MODULE_ORDER.indexOf(moduleId);

    if (moduleIndex === -1) {
      window.location.href = 'modules.html';
    }

    if (!canOpen(moduleId)) {
      window.location.href = 'modules.html';
    }

    const progress = getProgress();
    if (!progress[moduleId] || progress[moduleId] === 'not_started') {
      progress[moduleId] = 'in_progress';
      setProgress(progress);
    }

    const module = moduleData[moduleId] || moduleData.welcome;
    document.getElementById('crumb-title').textContent = module.title;
    document.getElementById('module-title').textContent = module.title;
    document.getElementById('module-overview-title').textContent = module.title;
    document.getElementById('module-id').textContent = module.idLabel;
    document.getElementById('module-status').textContent = 'In progress';
    document.getElementById('module-overview').textContent = module.overview;
    document.getElementById('quiz-question').textContent = module.question;
    document.getElementById('quiz-passage').textContent = module.passage;

    const list = document.getElementById('module-passages');
    list.innerHTML = module.passages.map(item => '<li>' + item + '</li>').join('');

    const answerList = document.getElementById('answer-list');
    answerList.innerHTML = module.answers.map((answer, index) => `
      <label class="answer-option">
        <input type="radio" name="module-answer" value="${index}" />
        <span>${answer}</span>
      </label>
    `).join('');

    const submitButton = document.createElement('button');
    submitButton.type = 'button';
    submitButton.className = 'button primary';
    submitButton.textContent = 'Submit answer';
    submitButton.style.margin = '1rem 0 0';
    submitButton.addEventListener('click', () => {
      const selected = document.querySelector('input[name="module-answer"]:checked');
      if (!selected) {
        return;
      }

      const progressState = getProgress();
      progressState[moduleId] = 'completed';
      setProgress(progressState);
      window.location.href = 'modules.html';
    });

    answerList.appendChild(submitButton);
  </script>
</body>
</html>
